[platformio]
; `pio run` builds only the board. The native env is for `pio test -e native`
; and cannot build src/main.cpp (no Arduino.h on a laptop).
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7
    chris--a/Keypad@^3.1.1

[env:native]
platform = native
; lib/drivers is Arduino-only hardware code, so the laptop tests skip it.
lib_ignore = drivers